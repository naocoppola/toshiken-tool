<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123b35" />
  <title>Toshiken Tools | 工具カード</title>
  <style>
    :root{--bg:#f1f5f3;--paper:#fff;--ink:#17221f;--muted:#65736e;--line:#dbe4df;--green:#176a58;--green-dark:#123b35;--mint:#e3f2ec;--gold:#e9b949;--shadow:0 12px 38px rgba(20,48,39,.09)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .wrap{max-width:860px;margin:auto;padding:20px 16px 36px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .brand{font-size:25px;font-weight:850;letter-spacing:.01em}.subtitle{color:var(--muted);font-size:14px}
    .badge{background:var(--mint);color:var(--green-dark);font-size:13px;font-weight:700;border-radius:999px;padding:7px 12px;white-space:nowrap}
    .intro{background:var(--green-dark);color:white;border-radius:22px;padding:18px 20px;margin-bottom:14px}
    .intro strong{font-size:18px;display:block}.intro p{margin:4px 0 0;color:#d6e9e1;font-size:14px}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
    .filters input,.filters select{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}
    .filterline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px;color:var(--muted);font-size:14px}
    .check{display:flex;align-items:center;gap:7px;white-space:nowrap}.check input{width:17px;height:17px;accent-color:var(--green)}
    .progress{height:7px;background:#dfe8e3;border-radius:99px;overflow:hidden;margin:0 2px 14px}.progress span{height:100%;display:block;background:var(--green);border-radius:inherit;transition:width .2s}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
    .cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.category{font-size:12px;font-weight:750;letter-spacing:.04em;color:var(--green);background:var(--mint);border-radius:999px;padding:5px 10px}.number{font-size:13px;color:var(--muted)}
    .visual{height:235px;background:#fbfcfb;border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px;position:relative}
    .visual img{max-width:100%;max-height:100%;object-fit:contain}.placeholder{display:none;text-align:center;color:#8c9a94}.placeholder .symbol{font-size:54px;line-height:1}.placeholder small{display:block;margin-top:8px;font-size:12px}
    .jpname{font-size:27px;font-weight:850;text-align:center;margin:14px 0 0}.reading{text-align:center;color:var(--muted);font-size:16px}.nickname{text-align:center;color:var(--green);font-weight:750;margin-top:3px}
    .explain{margin-top:16px;background:#f7faf8;border:1px solid var(--line);border-radius:17px;padding:15px}.label{color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.04em}.idname{font-size:20px;font-weight:850;color:var(--green-dark);margin-top:3px}.idexplain{font-size:17px;margin-top:5px}.jpuse{font-size:14px;color:#52615a;margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
    .actions{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;margin-top:13px}.btn{border:1px solid var(--line);background:white;border-radius:13px;padding:11px 9px;color:var(--ink);font-weight:700}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.mastered{background:#fff8e4;border-color:#f0d78e;color:#684b00}.btn:disabled{opacity:.42;cursor:default}
    .secondary{display:flex;justify-content:center;gap:8px;margin-top:9px}.secondary .btn{font-size:14px;padding:9px 13px}
    .empty{background:white;border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
    .listhead{font-size:13px;color:var(--muted);margin:0 2px 9px}.hidden{display:none!important}
    @media(max-width:540px){.wrap{padding:14px 12px 28px}.brand{font-size:22px}.intro{padding:15px 16px}.filters{grid-template-columns:1fr}.visual{height:205px}.card{padding:14px;border-radius:22px}.jpname{font-size:24px}.actions{grid-template-columns:.9fr 1.2fr .9fr}.btn{font-size:14px;padding:11px 5px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><div class="brand">Toshiken Tools</div><div class="subtitle">日本に来る前に、工具の名前を覚えよう</div></div>
      <div class="badge" id="totalBadge">70語</div>
    </header>
    <section class="intro"><strong>工具の単語カード</strong><p>日本語を見て考えたら「答えを見る」。名前と使い方をインドネシア語で確認できます。</p></section>
    <div class="filters">
      <input id="search" type="search" placeholder="工具名・インドネシア語で検索" aria-label="工具を検索" />
      <select id="category" aria-label="カテゴリで絞り込む"><option value="">すべてのカテゴリ</option></select>
    </div>
    <div class="filterline"><span id="deckCount">読み込み中…</span><label class="check"><input id="unlearnedOnly" type="checkbox" />まだ覚えていないカード</label></div>
    <div class="progress" aria-label="覚えたカードの進捗"><span id="progressBar" style="width:0%"></span></div>
    <section id="flashcard" class="card hidden" aria-live="polite">
      <div class="cardhead"><span class="category" id="cardCategory"></span><span class="number" id="cardNumber"></span></div>
      <div class="visual" id="visual">
        <img id="toolImage" alt="" />
        <div class="placeholder" id="placeholder"><div class="symbol">🔧</div><small>ことばで覚えよう</small></div>
      </div>
      <div class="jpname" id="jpName"></div><div class="reading" id="reading"></div><div class="nickname hidden" id="nickname"></div>
      <div class="explain hidden" id="answer">
        <div class="label">BAHASA INDONESIA · インドネシア語</div>
        <div class="idname" id="idName"></div><div class="idexplain" id="idExplain"></div>
        <div class="jpuse" id="jpUse"></div>
      </div>
      <div class="actions">
        <button class="btn" id="prev" type="button">← 前へ</button>
        <button class="btn primary" id="reveal" type="button">答えを見る</button>
        <button class="btn" id="next" type="button">次へ →</button>
      </div>
      <div class="secondary"><button class="btn" id="speak" type="button">🔊 日本語を聞く</button><button class="btn mastered" id="mark" type="button">✓ 覚えた</button></div>
    </section>
    <section id="empty" class="empty hidden">この条件に合うカードはありません。検索やカテゴリを変えてください。</section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let tools = [], deck = [], position = 0;
    const learned = new Set(JSON.parse(localStorage.getItem('toshiken-tools-learned-v1') || '[]').map(String));
    const symbols = {"手工具":"🔧","電動工具":"⚡","エア工具":"💨","測定工具":"📏","吊り具・運搬":"🏗️","清掃・仕上げ":"🧹","溶接・電気":"🛠️"};
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function saveLearned(){localStorage.setItem('toshiken-tools-learned-v1',JSON.stringify([...learned]));updateProgress();}
    function updateProgress(){const pct=tools.length?learned.size/tools.length*100:0;$('progressBar').style.width=pct+'%';$('totalBadge').textContent=`${learned.size}/${tools.length}語 覚えた`;}
    function buildCategories(){const cats=[...new Set(tools.map(t=>t.category).filter(Boolean))];$('category').innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');}
    function rebuildDeck(keepId){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,only=$('unlearnedOnly').checked;deck=tools.filter(t=>(!cat||t.category===cat)&&(!only||!learned.has(String(t.id)))&&(!q||[t.name,t.reading,t.nickname,t.indonesia,t.indonesia_explanation].some(v=>String(v||'').toLowerCase().includes(q))));let ix=keepId?deck.findIndex(t=>String(t.id)===String(keepId)):-1;position=ix>=0?ix:0;render();}
    function render(){ $('deckCount').textContent=deck.length?`${position+1} / ${deck.length} 枚`:'0枚';$('flashcard').classList.toggle('hidden',!deck.length);$('empty').classList.toggle('hidden',!!deck.length);if(!deck.length)return;const t=deck[position];$('cardCategory').textContent=t.category||'工具';$('cardNumber').textContent=`No.${String(t.id).padStart(2,'0')}`;$('jpName').textContent=t.name;$('reading').textContent=t.reading?`よみかた：${t.reading}`:'';$('nickname').textContent=t.nickname?`現場の呼び方：${t.nickname}`:'';$('nickname').classList.toggle('hidden',!t.nickname);$('idName').textContent=t.indonesia||'—';$('idExplain').textContent=t.indonesia_explanation||'—';$('jpUse').textContent=`やさしい日本語：${t.use||'—'}`;$('answer').classList.add('hidden');$('reveal').textContent='答えを見る';$('mark').textContent='✓ 覚えた';$('mark').classList.toggle('primary',learned.has(String(t.id)));$('prev').disabled=deck.length<2;$('next').disabled=deck.length<2;const img=$('toolImage'),placeholder=$('placeholder');if(t.image){img.src=t.image;img.alt=t.name+'の写真';img.classList.remove('hidden');placeholder.classList.add('hidden');img.onerror=()=>{img.classList.add('hidden');placeholder.classList.remove('hidden');placeholder.querySelector('.symbol').textContent=symbols[t.category]||'🔧';placeholder.style.display='block';};}else{img.removeAttribute('src');img.classList.add('hidden');placeholder.classList.remove('hidden');placeholder.querySelector('.symbol').textContent=symbols[t.category]||'🔧';placeholder.style.display='block';}}
    function move(delta){if(!deck.length)return;position=(position+delta+deck.length)%deck.length;render();}
    $('reveal').addEventListener('click',()=>{const answer=$('answer');const open=answer.classList.toggle('hidden')===false;$('reveal').textContent=open?'答えをかくす':'答えを見る';});
    $('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
    $('mark').addEventListener('click',()=>{if(!deck.length)return;const id=String(deck[position].id);if(learned.has(id))learned.delete(id);else learned.add(id);saveLearned();if($('unlearnedOnly').checked)rebuildDeck(deck[position]?.id);else render();});
    $('speak').addEventListener('click',()=>{if(!deck.length||!('speechSynthesis'in window))return;const t=deck[position];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.speak||t.reading||t.name);u.lang='ja-JP';u.rate=.82;speechSynthesis.speak(u);});
    $('search').addEventListener('input',()=>rebuildDeck());$('category').addEventListener('change',()=>rebuildDeck());$('unlearnedOnly').addEventListener('change',()=>rebuildDeck());
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){$('reveal').click();}});
    fetch('tools.json').then(r=>{if(!r.ok)throw new Error('tools.json');return r.json();}).then(data=>{tools=data;buildCategories();updateProgress();rebuildDeck();}).catch(err=>{$('deckCount').textContent='カードを読み込めません';$('empty').classList.remove('hidden');$('empty').textContent='工具データの読み込みに失敗しました。時間をおいてもう一度開いてください。';console.error(err);});
  </script>
</body>
</html>
